<h2>Insider Threat Detection</h2>

<form method="POST" action="/predict">
    <label>Login Time:</label>
    <input type="number" name="login_time" required>

    <label>File Access Count:</label>
    <input type="number" name="file_access" required>

    <label>Email Activity:</label>
    <input type="number" name="email_activity" required>

    <button type="submit">Check</button>
</form>
